# ─────────────────────────────────────────────────────────────────────────────
# Example: Adaptive icon (foreground + image background)
# ─────────────────────────────────────────────────────────────────────────────
# Composites a foreground layer onto an image background.
# Useful when the background has a gradient or texture.

icon:
  foreground: assets/foreground.png
  background: assets/background.png

platforms:
  - android
  - ios
  - macos
  - web
  - linux
  - windows
