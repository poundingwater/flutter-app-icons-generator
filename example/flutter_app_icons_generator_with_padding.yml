# ─────────────────────────────────────────────────────────────────────────────
# Example: Foreground padding control
# ─────────────────────────────────────────────────────────────────────────────
# Adjust how much the foreground is inset from the canvas edges.
#
# foreground_padding accepts:
#   - A decimal fraction: 0.0 (no padding) to < 0.5
#   - A percentage string: "20%" (equivalent to 0.2)
#
# Default is ~0.167 (Android's 72/108 safe zone ratio).

icon:
  foreground: assets/foreground.png
  background: "#1e1e2e"
  foreground_padding: 0.2

platforms:
  - android
  - ios
  - macos
  - web
  - linux
  - windows
