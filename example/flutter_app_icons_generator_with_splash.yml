# ─────────────────────────────────────────────────────────────────────────────
# Example: Icon + splash screen
# ─────────────────────────────────────────────────────────────────────────────
# Generate icons and a splash screen with an optional background color.

icon:
  foreground: assets/foreground.png
  background: "#1e1e2e"

splash:
  image: assets/foreground.png
  background_color: "#FFFFFF"

platforms:
  - android
  - ios
  - macos
  - web
  - linux
  - windows
