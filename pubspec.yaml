name: flutter_app_icons_generator
description: A Dart CLI tool that generates platform-specific app icons and native splash screens for Flutter projects with full app flavor support.

version: 0.2.3-dev

homepage: https://github.com/poundingwater/flutter-app-icons-generator
repository: https://github.com/poundingwater/flutter-app-icons-generator
issue_tracker: https://github.com/poundingwater/flutter-app-icons-generator/issues

environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.7.0
  image: ^4.9.1
  xml: ^7.0.1
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.4.0
  glados: ^1.1.1
  mockito: ^5.4.0
  test: ^1.25.0

executables:
  flutter_app_icons_generator: flutter_app_icons_generator
